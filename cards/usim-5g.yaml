# The 5G USIM card template (P1 N3; sim-uicc.md sections 2-3; TS 31.102 j60, TS 102 221 V18.4.0).
# A card is this template, personalised (EF.IMSI, EF.ICCID, EF.ACC, EF.AD, EF.MSISDN) and given its
# sealed secrets (K, OPc, PINs, ADM1): no secret is ever in this file. The values worth a note:
#   EF.UST: services 10 12 19 20 21 33 42 43 45 71 122 123 124 126 129 133 (122/123: DF.5GS MM
#     information and 5G security parameters; 133 goes with 123, TS 31.102 4.2.8; 124 without 125:
#     the ME computes the SUCI, null scheme in P1; no GSM access, 27).
#   EF.ARR records: 1 read always, update PIN1; 2 read and update PIN1; 3 read PIN1, update ADM1;
#     4 read always, update ADM1; 5 never read, update ADM1 (key files). (De)activation needs ADM1.
#   EF.SMSP: TS-Service Centre Address +99900000 (RP-DA is filled from it, KS-SMS-S1), PID 00, DCS 00,
#     validity 24 h. EF.SUCI_Calc_Info: the null scheme only (scheme 0, key index 0), no HN keys.
#   EF.Routing_Indicator 0000. EF.USIM_SQN: SQN and delta checks on, IND length 5, delta 2^28.
#   AF20 and AF30 are sysmoISIM's EF.USIM_AUTH_KEY and EF.USIM_SQN layouts (usim.hpp).
