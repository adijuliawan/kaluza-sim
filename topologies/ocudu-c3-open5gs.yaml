#
# P2 Q13: combination C3 against the Open5GS rig (lab.md, ADR 0010): our UE farm and DU with
# OCUDU's ocucp and ocuup on the dev PC, F1 and E1 on loopback, N2 and N3 from the dev PC's
# vmnet8 address to the rig AMF and UPF at 192.168.134.128. Run with
# OCUDU_N2N3_BIND=192.168.134.1 and OCUDU_SLICE_SD=1 (tools/ocudu-peer.sh), and the rig's
# subscribers provisioned. The UEs are the 13 of split-open5gs.yaml, with the personas of
# ocudu-c3-stub.yaml (row ksim-p2.ocudu-capability compares the UE's answer with its persona's).
plmn: "00101"
seed: 42
mode: split
amf: [{addr: 192.168.134.128, port: 38412}]
gnbs:
  - id: {value: 0x1A1, bits: 22}
    name: ocudu-gnb
    peers: {cucp: ocudu, cuup: ocudu}
    dus: [{id: 1, cells: [{pci: 101, tac: 1, arfcn: 632628}]}]
    split: {f1c: 127.0.10.1, e1: 127.0.20.1, du: 127.0.10.2, cuup: 127.0.10.3, cuup_e1: 127.0.20.2, streams: 16}
ues:
  - {group: s22, count: 6, range: "001010000300001", card: {template: ../cards/usim-5g.yaml}, nssai: ["1-000001"],
     imeisv_tac: "86000000", persona: ../personas/s22plus.yaml}
  - {group: op9, count: 7, range: "001010000300007", card: {template: ../cards/usim-5g.yaml}, nssai: ["1-000001"],
     imeisv_tac: "86000000", persona: ../personas/oneplus9pro.yaml}
secrets: {sealed: ~/.kaluza-sim/cards, kek: ~/.kaluza-sim/secrets/kek.key}
peer: {name: open5gs, repo: adijuliawan/open5gs, commit: 741c29d8d, rig: amadeus-open5gs, config: kaluza-sim-rig/etc}
netd: {nodes: false, ues: true}
