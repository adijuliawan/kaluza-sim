#
# The split run against kaluza-core in the lab (P2 Q6; ADR 0011; lab.md 3): on
# kaluza-uesim with ksim run --lab, in a window agreed with the kaluza-core
# session (LW1). Each role is a process in a namespace of its own, made by
# ksim-netd v3 (--mid 10.250.0.0/24):
#   CU-CP  ksim-cucp: ipvlan on ens19 with 172.30.30.30/24 (NG-C to the AMF at
#          .1:38412), and its ksim-mid leg 10.250.0.1/24 (F1-C 38472, E1 38462);
#   CU-UP  ksim-cuup: ipvlan with 172.30.30.31/24 (N3 to the V-UPF at .2), and
#          its leg 10.250.0.3/24 (F1-U 2152, E1);
#   DU     ksim-du: its leg 10.250.0.2/24 only (F1-C, F1-U);
#   UEs    the farm in the root namespace, KAIR over the run's SEQPACKET socket,
#          each UE in its namespace ksim-ue-<n> with a TUN per session.
# ksim-mid has no uplink and never touches ens19. The UEs are aio-lab.yaml's.
plmn: "00101"
seed: 42
mode: split
amf: [{addr: 172.30.30.1, port: 38412}]
gnbs:
  - id: {value: 0x1A0, bits: 22}
    name: ksim-gnb1
    cucp: {ng_bind: 172.30.30.30}
    cuup: {n3_bind: 172.30.30.31}
    dus: [{id: 1, cells: [{pci: 101, tac: 1, arfcn: 632628}]}]
    split: {f1c: 10.250.0.1, e1: 10.250.0.1, du: 10.250.0.2, cuup: 10.250.0.3, cuup_e1: 10.250.0.3, streams: 16}
ues:
  - {group: w0, count: 10, range: "001010000300000", card: {template: ../cards/usim-5g.yaml}, nssai: ["1-000001"],
     imeisv_tac: "86000000"}
  - {group: sms, count: 2, range: "001010000300050", card: {template: ../cards/usim-5g.yaml}, nssai: ["1-000001"],
     imeisv_tac: "86000000"}
  - {group: shortreg, count: 1, range: "001010000300060", card: {template: ../cards/usim-5g.yaml}, nssai: ["1-000001"],
     imeisv_tac: "86000000"}
secrets: {sealed: ~/.kaluza-sim/cards, kek: ~/.kaluza-sim/secrets/kek.key}
peer: {name: kaluza-core}
netd: {netns: ksim-cucp, cuup_netns: ksim-cuup, du_netns: ksim-du, parent: ens19, prefix: 24, mid: true, mid_prefix: 24}
