#
# The split run against ksim-corestub on loopback (P2 Q3; ADR 0011): the CU-CP,
# CU-UP, DU and UE farm as processes of their own, F1-C and E1 over SCTP, F1-U
# over UDP, KAIR over the run's SEQPACKET socket, all on 127.0.0.x. The same
# UEs as aio-stub.yaml, so every P1 gate runs here unchanged.
plmn: "00101"
seed: 42
mode: split
amf: [{addr: 127.0.0.1, port: 39412}]
gnbs:
  - id: {value: 0x1A0, bits: 22}
    name: ksim-gnb1
    cucp: {ng_bind: 127.0.0.2}
    cuup: {n3_bind: 127.0.0.4}
    dus: [{id: 1, cells: [{pci: 101, tac: 1, arfcn: 632628}]}]
    split: {f1c: 127.0.10.1, e1: 127.0.20.1, du: 127.0.10.2, cuup: 127.0.10.3, cuup_e1: 127.0.20.2, streams: 16}
ues:
  - {group: s22, count: 6, range: "001010000300001", card: {template: ../cards/usim-5g.yaml}, nssai: [1],
     imeisv_tac: "86000000", persona: ../personas/s22plus.yaml}
  - {group: op9, count: 6, range: "001010000300007", card: {template: ../cards/usim-5g.yaml}, nssai: [1],
     imeisv_tac: "86000000", persona: ../personas/oneplus9pro.yaml}
secrets: {sealed: ~/.kaluza-sim/cards, kek: ~/.kaluza-sim/secrets/kek.key}
peer: {name: ksim-corestub}
