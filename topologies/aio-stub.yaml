#
# All-in-one against ksim-corestub on loopback (P1 N8): the component runs of
# tools/ci.d/65-component.sh and gates/cores/stub.env. The stub listens on
# 127.0.0.1:39412, clear of the real AMF (172.30.30.1:38412) on the dev PC.
# The secrets are the user's range files; CI passes throwaway ones with
# ksim run --sealed/--kek.
plmn: "00101"
seed: 42
amf: [{addr: 127.0.0.1, port: 39412}]
gnbs:
  - id: {value: 0x1A0, bits: 22}
    name: ksim-gnb1
    cucp: {ng_bind: 127.0.0.2}
    dus: [{id: 1, cells: [{pci: 101, tac: 1, arfcn: 632628}]}]
ues:
  - {group: phones, count: 4, range: "001010000300001", card: {template: ../cards/usim-5g.yaml}, nssai: [1],
     imeisv_tac: "86000000"}
secrets: {sealed: ~/.kaluza-sim/cards, kek: ~/.kaluza-sim/secrets/kek.key}
peer: {name: ksim-corestub}
