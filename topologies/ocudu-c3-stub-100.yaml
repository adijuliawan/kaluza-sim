#
# 100 UEs through OCUDU's CU-CP and CU-UP (P2 Q7; row ksim-p2.ocudu-100):
# ocudu-c3-stub.yaml with imsi-001010000300000..099 and the UE farm on 4 shards.
plmn: "00101"
seed: 42
mode: split
amf: [{addr: 127.0.0.1, port: 39412}]
gnbs:
  - id: {value: 0x1A1, bits: 22}
    name: ocudu-gnb
    peers: {cucp: ocudu, cuup: ocudu}
    dus: [{id: 1, cells: [{pci: 101, tac: 1, arfcn: 632628}]}]
    split: {f1c: 127.0.10.1, e1: 127.0.20.1, du: 127.0.10.2, cuup: 127.0.10.3, cuup_e1: 127.0.20.2, streams: 16}
ues:
  - {group: s22, count: 50, range: "001010000300000", card: {template: ../cards/usim-5g.yaml}, nssai: [1],
     imeisv_tac: "86000000", persona: ../personas/s22plus.yaml}
  - {group: op9, count: 50, range: "001010000300050", card: {template: ../cards/usim-5g.yaml}, nssai: [1],
     imeisv_tac: "86000000", persona: ../personas/oneplus9pro.yaml}
secrets: {sealed: ~/.kaluza-sim/cards, kek: ~/.kaluza-sim/secrets/kek.key}
peer: {name: ksim-corestub}
farm: {shards: 4}
