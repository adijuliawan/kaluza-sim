#
# C3 against kaluza-core in the lab for the P1 rows (P2 Q14, LW5c): ocudu-c3-lab.yaml's OCUDU
# placement with split-lab.yaml's 13 UEs, whose subscriptions the rows need: w0 (10), sms (2,
# SMS in their profile, SMS_UE1/2) and shortreg (1, the short subsRegTimer, SHORTREG_UE=13),
# with personas, as ocudu-c3-stub.yaml has (row ksim-p2.ocudu-capability). On kaluza-uesim with
# KSIM_LAB=1, in a window agreed with the kaluza-core session.
plmn: "00101"
seed: 42
mode: split
amf: [{addr: 172.30.30.1, port: 38412}]
gnbs:
  - id: {value: 0x1A1, bits: 22}
    name: ocudu-gnb
    peers: {cucp: ocudu, cuup: ocudu}
    dus: [{id: 1, cells: [{pci: 101, tac: 1, arfcn: 632628}]}]
    split: {f1c: 10.250.0.1, e1: 10.250.0.1, du: 10.250.0.2, cuup: 10.250.0.3, cuup_e1: 10.250.0.3, streams: 16}
ues:
  - {group: w0, count: 10, range: "001010000300000", card: {template: ../cards/usim-5g.yaml}, nssai: ["1-000001"],
     imeisv_tac: "86000000", persona: ../personas/s22plus.yaml}
  - {group: sms, count: 2, range: "001010000300050", card: {template: ../cards/usim-5g.yaml}, nssai: ["1-000001"],
     imeisv_tac: "86000000", persona: ../personas/s22plus.yaml}
  - {group: shortreg, count: 1, range: "001010000300060", card: {template: ../cards/usim-5g.yaml}, nssai: ["1-000001"],
     imeisv_tac: "86000000", persona: ../personas/oneplus9pro.yaml}
secrets: {sealed: ~/.kaluza-sim/cards, kek: ~/.kaluza-sim/secrets/kek.key}
peer: {name: kaluza-core}
netd: {du_netns: ksim-du, parent: ens19, prefix: 24, mid: true, mid_prefix: 24}
