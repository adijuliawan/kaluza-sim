#
# 100 UEs in split mode against kaluza-core (P2 Q7, LW1; rows ksim-p2.scale-100-*):
# split-lab.yaml with imsi-001010000300000..099, imported on kaluza-core for P2,
# and the UE farm on 4 shards. On kaluza-uesim with --lab, in a window agreed with
# the kaluza-core session: 10 attaches at a time, everything released and switched off after.
plmn: "00101"
seed: 42
mode: split
amf: [{addr: 172.30.30.1, port: 38412}]
gnbs:
  - id: {value: 0x1A0, bits: 22}
    name: ksim-gnb1
    cucp: {ng_bind: 172.30.30.30}
    cuup: {n3_bind: 172.30.30.31}
    dus: [{id: 1, cells: [{pci: 101, tac: 1, arfcn: 632628}]}]
    split: {f1c: 10.250.0.1, e1: 10.250.0.1, du: 10.250.0.2, cuup: 10.250.0.3, cuup_e1: 10.250.0.3, streams: 16}
ues:
  - {group: s22, count: 50, range: "001010000300000", card: {template: ../cards/usim-5g.yaml}, nssai: ["1-000001"],
     imeisv_tac: "86000000", persona: ../personas/s22plus.yaml}
  - {group: op9, count: 50, range: "001010000300050", card: {template: ../cards/usim-5g.yaml}, nssai: ["1-000001"],
     imeisv_tac: "86000000", persona: ../personas/oneplus9pro.yaml}
secrets: {sealed: ~/.kaluza-sim/cards, kek: ~/.kaluza-sim/secrets/kek.key}
peer: {name: kaluza-core}
netd: {netns: ksim-cucp, cuup_netns: ksim-cuup, du_netns: ksim-du, parent: ens19, prefix: 24, mid: true, mid_prefix: 24}
farm: {shards: 4}
