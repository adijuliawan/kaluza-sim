# SPDX-License-Identifier: LicenseRef-kaluza-sim-private
#
# REUSE metadata (ADR 0004). Our own source files carry SPDX headers, which
# tools/guards/check_spdx.py enforces. This file covers files that cannot carry
# a header (Markdown, JSON, TSV, extracted ASN.1, …). Third-party trees get
# their own, more specific annotations below the catch-all; the last matching
# annotation wins.
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Adi Juliawan"
SPDX-License-Identifier = "LicenseRef-kaluza-sim-private"

# asn1c runtime (mouse07410 fork at 18e565032e52), vendored unmodified except
# for patches listed in third_party/asn1c/patches/series (ADR 0004: BSD-2 may
# be copied with its licence).
[[annotations]]
path = ["third_party/asn1c/runtime/**", "third_party/asn1c/LICENSE"]
precedence = "override"
SPDX-FileCopyrightText = "2003-2017 Lev Walkin <vlm@lionet.info> and contributors"
SPDX-License-Identifier = "BSD-2-Clause"

# Text extracted verbatim from 3GPP specifications (ASN.1 modules, transcribed
# tables and test vectors). The tools that extract them are ours; the content is
# 3GPP's.
[[annotations]]
path = ["spec/asn1/**/*.asn"]
precedence = "override"
SPDX-FileCopyrightText = "3GPP Organizational Partners (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC)"
SPDX-License-Identifier = "LicenseRef-3GPP-Spec-Text"

[[annotations]]
path = ["spec/nas/**/*.tsv", "spec/kat/milenage.tsv", "spec/kat/rijndael.tsv", "spec/kat/keccak.tsv",
        "spec/kat/tuak.tsv", "spec/kat/milenage256.tsv", "spec/kat/eea2.tsv", "spec/kat/eia2.tsv",
        "spec/kat/eia1.tsv", "spec/kat/ecies.tsv"]
precedence = "override"
SPDX-FileCopyrightText = "3GPP Organizational Partners (ARIB, ATIS, CCSA, ETSI, TSDSI, TTA, TTC)"
SPDX-License-Identifier = "LicenseRef-3GPP-Spec-Text"

[[annotations]]
path = ["spec/kat/uea2.tsv", "spec/kat/uia2.tsv"]
precedence = "override"
SPDX-FileCopyrightText = "ETSI SAGE"
SPDX-License-Identifier = "LicenseRef-SAGE-Test-Data"

[[annotations]]
path = ["spec/kat/eap_aka_prime.tsv"]
precedence = "override"
SPDX-FileCopyrightText = "IETF Trust and the persons identified as the document authors (RFC 9048)"
SPDX-License-Identifier = "LicenseRef-IETF-RFC-Text"

# The external-origin corpus: rows carry octets from OCUDU's BSD unit tests and
# from the user's kaluza-core testkit captures (per-row licence column).
[[annotations]]
path = ["tests/vectors/*/index.tsv", "tests/vectors/excluded.tsv"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Adi Juliawan", "2021-2026 Software Radio Systems Limited (OCUDU unit-test vectors)"]
SPDX-License-Identifier = "LicenseRef-kaluza-sim-private AND BSD-3-Clause-Open-MPI"

# OCUDU's own builders and encoder produced these octets (tools/ocudu_vectors).
[[annotations]]
path = ["tests/vectors/sources/ocudu-produced.tsv"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 Adi Juliawan", "2021-2026 Software Radio Systems Limited (OCUDU test message builders)"]
SPDX-License-Identifier = "LicenseRef-kaluza-sim-private AND BSD-3-Clause-Open-MPI"
