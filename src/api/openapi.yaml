#
# The control API, v0 (P1 N8; ADR 0009 point 7; architecture section 9; cli.md).
# Served on <run>/ctl.sock (and optionally TCP 127.0.0.1:PORT). Every answer
# except /v1/events is a Reply: {"exit": n, "kv": {KEY: "value", ...}}, with an
# HTTP status that matches the exit code of cli.md section 2. The keys and
# their order are a contract: gates read them as KEY=value lines.
openapi: 3.1.0
info:
  title: kaluza-sim control API
  version: 0.1.0
  description: >-
    The v0 verbs of P1 N8. A UE route takes one UE: imsi-<15 digits> or its farm
    index. ksim-ctl resolves group:<name> and all through /v1/ues.
paths:
  /v1/version:
    get:
      summary: VERSION, COMMIT, BUILD, SPEC_PINS, ASN1C
      responses: {"200": {$ref: "#/components/responses/Reply"}}
  /v1/capabilities:
    get:
      summary: CAP.<feature>=0|1 (or a value) for what this build serves
      responses: {"200": {$ref: "#/components/responses/Reply"}}
  /v1/faults:
    get:
      summary: >-
        P3 R3: FAULTS (0 when none is set), and per rule FAULT.<id>.RULE, FAULT.<id>.ROW,
        FAULT.<id>.HITS; a split run's supervisor merges its roles'
      responses: {"200": {$ref: "#/components/responses/Reply"}}
    post:
      summary: >-
        P3 R3: rule ("<link>.<dir> [msg=M] [ue=N] drop|dup|delay=MS [xN|x*] [pct=P]",
        cli.md), row (the gate row it serves, default -), id (a split run's supervisor
        gives one): FAULT_ID, RULE. Recorded in <run>/faults.tsv. Exit 2 for a rule it
        cannot read or apply
      responses: {"200": {$ref: "#/components/responses/Reply"}, "400": {$ref: "#/components/responses/Reply"}}
  /v1/faults/clear:
    post:
      summary: "P3 R3: id (or all, the default): CLEARED, FAULTS"
      responses: {"200": {$ref: "#/components/responses/Reply"}}
  /v1/info:
    get:
      summary: >-
        ROLE, NG_UP, NG_SETUP, F1_SETUP, CELL_ACTIVE, UES, RAN_UES, KAIR_FRAMES,
        KAIR_ERRORS, GNB, PLMN, AMF, RUN_DIR, EVENT_SEQ, LOOP_LAG_MAX_MS
      responses: {"200": {$ref: "#/components/responses/Reply"}, "503": {$ref: "#/components/responses/Reply"}}
  /v1/nodes:
    get:
      summary: NODES, NODE.<n>.NAME, NODE.<n>.ROLE
      responses: {"200": {$ref: "#/components/responses/Reply"}}
  /v1/ues:
    get:
      summary: UES, UE.<index>=imsi-..., UE.<index>.GROUP
      responses: {"200": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/status:
    get:
      summary: >-
        UE, INDEX, POWER, RM_STATE, CM_STATE, RRC_STATE, MM_STATE (TS 24.501 state
        names), UPDATE_STATUS, USIM, CAMPED, AS_SECURITY, and when known GUTI
        (<mcc><mnc>-<region>-<set>-<pointer>-<tmsi>, hex), TAI (<mcc><mnc>-<tac hex>),
        C_RNTI, T3512_S
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "404": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/power:
    post:
      summary: >-
        state=on: card read, fixed camping, initial registration; with wait_ms it
        ends at nas.reg.accept (exit 0) or nas.reg.reject / nas.reg.abort (exit 1).
        state=off with mode=switch-off (or graceful): a switch-off de-registration,
        ending at nas.dereg.sent switch_off=1, the context and the 5G-GUTI written
        to the USIM; mode=abrupt (N12): the battery pulled, no signalling and no
        card write, ending at ue.power state=off.
      parameters: [{$ref: "#/components/parameters/sel"}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                state: {enum: ["on", "off"]}
                mode: {enum: [switch-off, graceful, abrupt]}
                wait_ms: {type: string, pattern: "^[0-9]{1,9}$"}
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/register:
    post:
      summary: >-
        type=initial; wait_ms as for power on. type=update (N13): a mobility
        registration update on the UE's connection (SMS requested again), ending at
        nas.reg.accept type=mobility
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/deregister:
    post:
      summary: >-
        type=normal (ends at nas.dereg.accept, or nas.dereg.abort with exit 1) or
        switch-off (ends at nas.dereg.sent switch_off=1)
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/service-request:
    post:
      summary: >-
        N12: a SERVICE REQUEST for signalling from CM-IDLE; with wait_ms it ends at
        nas.sr.accept (exit 0), nas.sr.reject or nas.sr.abort (exit 1)
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/sim:
    post:
      summary: >-
        N12: action=remove takes the UICC out of the reader (a registered UE
        de-registers, then 5GMM-DEREGISTERED.NO-SUPI); action=insert puts it back (read
        again, then a registration)
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/sim:
    get:
      summary: >-
        N14: PRESENT, ICCID, IMSI, MSISDN, UST (the services available), SUCI_SCHEMES,
        ROUTING_INDICATOR, ATR, TRACE: read from the card in the reader, never a key
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "404": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/sim-read:
    get:
      summary: >-
        N14: ef (a name such as EF.IMSI or IMSI, a FID, or a FID path): EF, PATH, and DATA or
        RECORDS with RECORD.<n>, in hex. Key files, the NAS security contexts and what
        the card's ARR keeps from a reader are refused (exit 6)
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/sim-trace:
    post:
      summary: >-
        N14: state=on|off: the card's APDUs into the run's sim.pcapng as GSMTAP-SIM,
        redacted (sim-uicc.md 6); event ue.sim.trace
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/airplane:
    post:
      summary: >-
        N12: state=on de-registers as for switch-off and turns the radio off; state=off
        powers the UE on again
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/rlf:
    post:
      summary: >-
        P3 R3 (KS-L2R-005): a radio link failure at once (rrc.connection_lost, radio link
        failure); the UE's NAS then recovers its connection. Exit 6 in RRC_IDLE
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/sms-send:
    post:
      summary: >-
        N13: to (digits), text (UTF-8), ucs2=1, srr=1, vp (TP-VP relative): an MO short
        message, in concatenated parts past one TPDU; with wait_ms it ends at the last
        part's sms.mo.done (RESULT ack, error with CAUSE, or failed). Exit 6 with
        nothing sent while SMS over NAS is not allowed
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/sms:
    get:
      summary: >-
        N13: SMS_ALLOWED, MESSAGES and per stored message SMS.<n>.FROM, .TEXT, .DCS,
        .UD (TP-UD, hex), .RECORD (EF.SMS), .CONCAT (part/parts/reference)
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "404": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/sms-memory:
    post:
      summary: >-
        N13: state=full makes MT messages get RP-ERROR #22; state=available sends
        RP-SMMA when the network had a #22 (TS 24.011 6.3.2)
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/ps:
    get:
      summary: >-
        N10: PDU_SESSIONS and per PSI PS.<psi>.DNN, .SNSSAI, .TYPE, .IP, .DNS, .MTU,
        .QFI, .AMBR_UL/.AMBR_DL, .STATE
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "404": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/ps-establish:
    post:
      summary: >-
        N10: type=ipv4, dnn, sst and sd (the S-NSSAI), psi (default: the lowest free);
        with wait_ms it ends at nas.sm.est.accept (RESULT=ACCEPT, PSI, IP, QFI) or a
        reject (RESULT=REJECT, CAUSE; exit 1). Refused with exit 6 while a back-off runs
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/ps-release:
    post:
      summary: N10 - psi; with wait_ms it ends at nas.sm.release (RESULT=ACCEPT)
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/ping:
    post:
      summary: >-
        N10/N11: dst, psi, count, interval_ms, size, df. In inject mode the UE's own
        echo requests (SENT, RECEIVED, LOSS_PCT, RTT_*); in netns mode iputils ping in
        the UE's namespace (EXIT_CODE, IFACE). MODE=inject|netns
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/exec:
    post:
      summary: >-
        N11, netns mode only: argv run in the UE's namespace as the caller (never root)
        through ksim-netd; timeout_ms; EXIT_CODE, STDOUT, STDERR, TIMED_OUT
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/ue/{sel}/ifaces:
    get:
      summary: >-
        N11: MODE, NETNS, IFACES and per interface its address and MTU; KERNEL.* the
        kernel's own view in netns mode; NOISE (uplink packets not from a session)
      parameters: [{$ref: "#/components/parameters/sel"}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "404": {$ref: "#/components/responses/Reply"}}
  /v1/wait:
    get:
      summary: >-
        A long poll over the run's numbered events. event and fail are comma lists
        of names from src/api/events.tsv; ue (a UE selector) or subject narrows it;
        where=key=value (repeatable) matches fields; since=N (default 0: events
        already recorded match) or new=1; timeout_ms (default 30000, at most
        600000). A match prints EVENT, SEQ, T_MS, SUBJECT, UE and the event's
        fields upper-cased; a fail event exits 1 with CAUSE from its cause or
        reason field; no match exits 3.
      parameters:
        - {name: event, in: query, required: true, schema: {type: string}}
        - {name: fail, in: query, schema: {type: string}}
        - {name: ue, in: query, schema: {type: string}}
        - {name: subject, in: query, schema: {type: string}}
        - {name: where, in: query, schema: {type: string}}
        - {name: since, in: query, schema: {type: string}}
        - {name: new, in: query, schema: {enum: ["1"]}}
        - {name: timeout_ms, in: query, schema: {type: string}}
      responses: {"200": {$ref: "#/components/responses/Reply"}, "422": {$ref: "#/components/responses/Reply"}, "504": {$ref: "#/components/responses/Reply"}}
  /v1/events:
    get:
      summary: >-
        The events after since (default 0) as NDJSON (one object per line:
        seq, t_ms, wall_ns, event, subject, fields), filtered by subject and a
        name prefix (filter); follow=1 keeps the stream open.
      parameters:
        - {name: since, in: query, schema: {type: string}}
        - {name: subject, in: query, schema: {type: string}}
        - {name: filter, in: query, schema: {type: string}}
        - {name: follow, in: query, schema: {enum: ["1"]}}
      responses:
        "200": {description: NDJSON, content: {application/x-ndjson: {}}}
  /v1/gnb/{name}/ue-list:
    get:
      summary: UES, UE.<n>.RAN_UE_NGAP_ID, UE.<n>.AMF_UE_NGAP_ID, UE.<n>.C_RNTI, UE.<n>.PHASE
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "404": {$ref: "#/components/responses/Reply"}}
  /v1/gnb/{name}/amf-list:
    get:
      summary: AMFS, AMF.<n>.ADDR, AMF.<n>.SCTP=up|down, AMF.<n>.NG_SETUP, AMF.<n>.NAME
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "404": {$ref: "#/components/responses/Reply"}}
  /v1/gnb/{name}/ue-release:
    post:
      summary: >-
        N12: ue (a UE selector) and cause (default user-inactivity): the CU-CP sends
        UE CONTEXT RELEASE REQUEST for that UE's RRC connection; RESULT=STARTED,
        RAN_UE_NGAP_ID, CAUSE. Refused (exit 4) without a connection or while a UE
        procedure is in progress
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "404": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/gnb/{name}/restart:
    post:
      summary: >-
        N12: the DU, CU-CP and CU-UP stop and start again, the cell off the air for
        2 s (ledger A-14); RESULT=STARTED, EVENT_SEQ (wait for ran.ng.setup after it)
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "404": {$ref: "#/components/responses/Reply"}}
  /v1/du/{name}/cell:
    post:
      summary: >-
        P3 R3 (KS-L2R-005): state=off takes the DU's cell off the air and asks for the
        release of each UE it served (ran.du.cell_off); state=on puts it back
        (ran.du.cell_on): CELL, CELL_ACTIVE. Exit 6 when it is in that state already
      parameters: [{name: name, in: path, required: true, schema: {type: string}}]
      responses: {"200": {$ref: "#/components/responses/Reply"}, "404": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/stop:
    post:
      summary: Ends the run (STOPPING=1); the manifest records the end.
      responses: {"200": {$ref: "#/components/responses/Reply"}}
  /v1/stub:
    get:
      summary: >-
        ksim-corestub only: ASSOCIATIONS, NG_SETUP, UES, RECEIVED.<NGAP message>,
        REGISTERED, ERROR_INDICATIONS, FAILURES, FAILURE.<n> (each failed check
        with its clause)
      responses: {"200": {$ref: "#/components/responses/Reply"}}
  /v1/stub/release:
    post:
      summary: "ksim-corestub, N10: ue (SUPI or index), psi, cause: a network-requested PDU session release"
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/stub/ping-ue:
    post:
      summary: "ksim-corestub, N10: ue, psi, seq: an echo request from the DN to the UE (held and paged for while it is idle, N12)"
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/stub/deregister:
    post:
      summary: "ksim-corestub, N12: ue, rereg=1 for re-registration required: a network-initiated de-registration"
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/stub/t3512:
    post:
      summary: "ksim-corestub, N12: seconds: the T3512 value of the next accepts"
      responses: {"200": {$ref: "#/components/responses/Reply"}}
  /v1/stub/sms-sub:
    post:
      summary: >-
        ksim-corestub, N13: ue (SUPI), on=0|1: SMS in that UE's subscription or not,
        for its next REGISTRATION ACCEPT (kept until the gNB associates)
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
  /v1/stub/restart:
    post:
      summary: >-
        ksim-corestub, N12: an AMF restart: AMF STATUS INDICATION, then the association
        aborted after 300 ms; the UE contexts stay for the gNB's next association
      responses: {"200": {$ref: "#/components/responses/Reply"}, "409": {$ref: "#/components/responses/Reply"}}
components:
  parameters:
    sel: {name: sel, in: path, required: true, schema: {type: string}, description: "imsi-<15 digits> or a farm index"}
  responses:
    Reply:
      description: >-
        exit is cli.md section 2's code (0 ok, 1 failed with CAUSE, 2 usage,
        3 timeout, 4 unknown node or UE, 5 capability absent, 6 wrong state,
        7 abort, 10 internal); kv holds the KEY=value pairs in order.
      content:
        application/json:
          schema:
            type: object
            required: [exit, kv]
            properties:
              exit: {type: integer}
              kv: {type: object, additionalProperties: {type: string}}
